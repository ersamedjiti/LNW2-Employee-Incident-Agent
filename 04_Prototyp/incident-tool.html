<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Assessor-Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Arbeitsfläche (Fallakte) links, Fallkontext rechts; oben Stepper durch die vier Phasen */
:root {
  --bg: #fcf9f3; --surface: #ffffff; --surface-2: #fbf9f5; --ink: #1a1f2b; --muted: #646b78; --line: #ece6da; --line-2: #ddd5c6;
  --accent: #2453c7; --accent-ink: #ffffff; --accent-soft: #e8eefc;
  --ai: #2453c7; --ai-soft: #eef3fe; --ai-line: #a3b8ee;
  --ok: #1e7a45; --ok-soft: #e3f4e8; --warn: #c0322b; --warn-soft: #fde8e6;
  --rem: #e3f4e8; --rem-ink: #1e6b3e; --ei: #fdeeec; --ei-ink: #b5392f; --hr: #f8d2cd; --hr-ink: #8f1a12;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-label: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.bar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
#top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 15px var(--f-label); }
.bt { font: 600 15px var(--f-label); letter-spacing: .01em; }
.bs { color: var(--muted); font-size: 12px; }
.top-r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.who { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; font: 500 12.5px var(--f-body); cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
#steps { display: flex; gap: 4px; padding-block: 0 8px; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 6px 12px 6px 6px; border-radius: 999px; color: var(--muted); font: 500 13.5px var(--f-body); cursor: pointer; white-space: nowrap; }
.step .sn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font: 500 12px var(--f-mono); }
.step.active { background: var(--accent-soft); color: var(--ink); }
.step.active .sn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step.done .sn { border-color: var(--ok); color: var(--ok); }
.step:disabled { opacity: .45; cursor: not-allowed; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; padding-block: 20px 48px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
#main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#side { display: flex; flex-direction: column; gap: 12px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); }
@media (max-width: 960px) { #side { position: static; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 1px 2px rgba(60,45,20,.04); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel.slim { padding: 12px 16px; }
.panel.ai-frame { border: 1px dashed var(--ai-line); }
.panel.ausbau { background: var(--surface-2); }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h2 { font: 600 16px var(--f-label); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h3 { font: 600 14px var(--f-label); margin: 0; letter-spacing: .01em; }
p { margin: 0; }
.hint { color: var(--muted); font-size: 12.5px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); }
.lab { display: block; font: 500 11.5px var(--f-label); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.mini { text-transform: none; letter-spacing: 0; color: var(--ai); font-weight: 500; }
input, textarea, select { width: 100%; font: 14px/1.45 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 7px 9px; }
textarea { resize: vertical; }
input[readonly], textarea[readonly] { background: var(--surface-2); }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#report { font-family: var(--f-mono); font-size: 13px; }
.row { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.row .fld { min-width: 200px; }
.grow { flex: 1; }
.btn { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 8px 14px; font: 500 13.5px var(--f-body); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; }
.actions .hint { margin-right: auto; }
.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.preset { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 9px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
.preset.on { border-color: var(--accent); background: var(--accent-soft); }
.pt { font: 500 13.5px var(--f-body); }
.ps { font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 11.5px var(--f-label); letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.sm { font-size: 10.5px; padding: 1px 6px; }
.chip-ai { background: var(--ai-soft); color: var(--ai); border: 1px dashed var(--ai-line); }
.chip-ok { background: var(--ok-soft); color: var(--ok); }
.chip-muted { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.grid2 .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.check input { width: auto; }
.cands { display: flex; flex-direction: column; gap: 6px; }
.cand { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--r); padding: 9px 11px; cursor: pointer; }
.cand.on { border-color: var(--accent); background: var(--accent-soft); }
.cand input { width: auto; margin-top: 3px; }
.cn { flex: 1; min-width: 0; }
.why { font-size: 12.5px; }
.conf { font: 500 11px var(--f-label); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.conf-hoch { background: var(--ok-soft); color: var(--ok); }
.conf-niedrig { background: var(--warn-soft); color: var(--warn); }
.more summary { cursor: pointer; color: var(--accent); font-size: 13px; padding-block: 2px; }
.more > *:not(summary) { margin-top: 8px; }
.list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
pre.mail { white-space: pre-wrap; font: 13px/1.5 var(--f-body); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 0; }
.warnline { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; background: var(--warn-soft); border-radius: var(--r); padding: 10px 12px; flex-wrap: wrap; }
.warnline > div { flex: 1; min-width: 220px; }
.alert { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 10px 12px; font-weight: 500; }
.alert.soft { font-weight: 400; }
.busy { display: flex; align-items: center; gap: 12px; background: var(--ai-soft); border: 1px dashed var(--ai-line); border-radius: var(--r); padding: 14px 16px; color: var(--ink); }
.spin { width: 16px; height: 16px; border: 2px solid var(--ai-line); border-top-color: var(--ai); border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.conf-banner { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.conf-banner b { font: 600 13px var(--f-label); text-transform: uppercase; letter-spacing: .05em; }
.conf-banner.conf-niedrig b { color: var(--warn); }
.conf-banner.conf-mittel b { color: var(--ink); }
.conf-banner.conf-hoch b { color: var(--ok); }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dcard.is-open { border: 1px dashed var(--ai-line); background: linear-gradient(var(--ai-soft), var(--ai-soft)) top / 100% 3px no-repeat, var(--surface); }
.dcard.is-done { border-color: var(--line-2); }
.dcard.is-rejected, .dcard.is-invalid { opacity: .7; }
.dcard header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.big { font: 600 20px var(--f-label); letter-spacing: .01em; }
blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--line-2); background: var(--surface-2); font-size: 13.5px; }
.code { font: 500 12px var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 720px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.sub-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.addrule { display: flex; gap: 8px; }
.addrule select { flex: 1; min-width: 0; }
.circ { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.circ li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; padding: 4px 8px; border-radius: 4px; background: var(--surface-2); }
.circ em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.circ .d-mildernd em { color: var(--ok); }
.circ .d-belastend em, .circ .d-schwer-belastend em { color: var(--warn); }
.note { padding-inline: 4px; }
.edit { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); padding: 10px; border-radius: var(--r); }
.lvl { display: inline-block; font: 600 12.5px var(--f-label); letter-spacing: .02em; padding: 3px 10px; border-radius: 4px; white-space: nowrap; }
.lvl.sm { font-size: 11px; padding: 1px 6px; }
.lv-rem { background: var(--rem); color: var(--rem-ink); }
.lv-ei { background: var(--ei); color: var(--ei-ink); }
.lv-hr { background: var(--hr); color: var(--hr-ink); }
.level { border-color: var(--line-2); }
.lvl-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .lvl-grid { grid-template-columns: minmax(0, 1fr); } }
.mx { display: grid; grid-template-columns: minmax(0, 1.25fr) repeat(3, minmax(0, 1fr)); gap: 3px; font-size: 11.5px; }
.mx-c { padding: 7px 5px; border-radius: 4px; text-align: center; opacity: .55; overflow-wrap: anywhere; }
.mx-h, .mx-r { background: transparent; opacity: 1; color: var(--muted); font: 500 11.5px var(--f-label); }
.mx-r { text-align: left; }
.mx-h.hl, .mx-r.hl { color: var(--ink); font-weight: 600; }
.mx-c.sel { opacity: 1; outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 600; }
.lvl-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.result { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r); }
.result > span:first-child { font: 500 11.5px var(--f-label); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.result.final { background: var(--ok-soft); }
.trig { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.trig li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mailhead { display: grid; gap: 2px; font-size: 13px; padding: 8px 12px; background: var(--surface-2); border-radius: var(--r); }
.mailhead span { display: inline-block; width: 52px; color: var(--muted); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.checks li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.checks li > span { font-weight: 600; width: 14px; }
.checks .ok > span { color: var(--ok); }
.checks .bad { color: var(--warn); }
.checks em { font-style: normal; color: var(--muted); font-size: 12px; }
.sentinfo { display: grid; gap: 4px; font-size: 13px; background: var(--ok-soft); padding: 10px 12px; border-radius: var(--r); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stats div { background: var(--surface-2); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; }
.stats b { font: 600 20px var(--f-mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.tablewrap { overflow-x: auto; }
table.log { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
.log th { text-align: left; font: 500 11.5px var(--f-label); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line-2); }
.log td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.log tr.a-ai td:nth-child(2) { color: var(--ai); font-weight: 500; }
.log tr.a-hu td:nth-child(2) { color: var(--accent); font-weight: 500; }
.log tr.a-sys td:nth-child(2) { color: var(--muted); }
.log td:first-child, .log td:nth-child(2) { white-space: nowrap; }
.side-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.side-card h3 { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; margin: 0; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.pname { font: 600 15px var(--f-label); }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.hist li { padding: 7px 9px; border-radius: 4px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.hist li.nc { opacity: .6; }
.dl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.dl li { display: flex; justify-content: space-between; gap: 8px; }
.dl b { font: 500 12.5px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dl li.done { color: var(--muted); text-decoration: line-through; }
.dl li.over b { color: var(--warn); }
.qs { display: flex; flex-direction: column; gap: 10px; }
.q { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.qh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: 500 13px var(--f-body); cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 13.5px var(--f-body); padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(40,30,10,.08); }
#app { padding-block: 20px 32px; }
.chat-wrap { max-width: 860px; margin: 0 auto; }
.chatpanel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 70vh; }
.cp-h { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.cp-h h1 { font: 600 19px var(--f-label); margin: 0 0 4px; }
.cp-h p { margin: 0; font-size: 13.5px; }
.msgs { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.chatpanel .msgs { max-height: 62vh; }
.msg { max-width: 88%; display: flex; flex-direction: column; gap: 6px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: 9px 13px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
.msg.ai { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); padding: 10px 13px; border-radius: 14px 14px 14px 4px; }
.msg.ai.err { border-color: var(--warn); }
.who-ai { font: 600 11px var(--f-label); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.msg .body p { margin: 0 0 6px; } .msg .body p:last-child { margin: 0; }
.msg .body ul, .msg .body ol { margin: 4px 0 6px; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.typing { color: var(--muted); font-style: italic; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px; }
.src { font: 500 11.5px var(--f-mono); background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 4px; }
.mwarn { font-size: 12.5px; background: var(--warn-soft); color: var(--warn); padding: 6px 9px; border-radius: 6px; }
.mchg { font-size: 12px; color: var(--ok); }
.qr, .ex { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.welcome p { color: var(--muted); margin: 0 0 8px; }
.sugg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.sug { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font: 14px var(--f-body); color: var(--ink); cursor: pointer; }
.sug:hover { border-color: var(--accent); }
.composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; }
.fine { font-size: 11.5px; color: var(--muted); padding: 0 16px 12px; margin: 0; }
.cap-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .cap-layout { grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; } }
@media (max-width: 700px) { .cap-layout { grid-template-columns: minmax(0, 1fr); } }
.mask { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.asst { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); min-width: 0; }
@media (max-width: 700px) { .asst { position: static; } }
.ap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; height: calc(100vh - 110px); min-height: 460px; }
@media (max-width: 700px) { .ap { height: 560px; } }
.ap-h { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }

function norm(s) { return s.toLowerCase().replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss"); }
function toks(s) { return norm(s).split(/[^a-z0-9-]+/).filter(t => t.length > 2 && !STOP.has(t)).map(t => t.length > 6 ? t.replace(/(ungen|ung|en|er|es|e|n|s)$/, "") : t); }

function retrieve(query, n = 6, exclude) {

  q.forEach(t => Object.keys(SYN).forEach(s => { if (t.startsWith(s.slice(0, 5))) extra.push(...SYN[s]); }));
  const terms = [...new Set(q.concat(extra))];

function addBD(d, n) { const x = new Date(d); let k = 0; while (k < n) { x.setDate(x.getDate() + 1); const w = x.getDay(); if (w !== 0 && w !== 6) k++; } return x; }
function minus12M(d) { const x = new Date(d); x.setFullYear(x.getFullYear() - 1); return x; }

// Pattern Aggregation nach Ist-Prozess
function patternCheck(history, personId, code, incidentDateStr, baseLevel) {
  const codes = (Array.isArray(code) ? code : [code]).filter(Boolean);
  const inc = parseD(incidentDateStr);
  const from = minus12M(inc);
  const considered = history.filter(h => h.person === personId).map(h => {
    const d = parseD(h.informed);
    let counts = true, why = "im 12-Monats-Fenster, abgeschlossen";
    if (h.status !== "abgeschlossen") { counts = false; why = h.status + ": zählt nicht"; }
    else if (h.linkedTo) { counts = false; why = "bereits " + h.linkedTo + " zugeordnet"; }
    else if (d < from || d > inc) { counts = false; why = "ausserhalb des 12-Monats-Fensters"; }
    return { ...h, counts, why };
  }).sort((a, b) => a.informed.localeCompare(b.informed));
  let level = baseLevel; const triggers = []; const rules = [];
  if (level === "Reminder") {
    const rem = considered.filter(h => h.counts && h.level === "Reminder");
    const same = rem.filter(h => codes.includes(h.code));
    if (same.length + 1 >= 2) { level = "Employee Incident"; triggers.push(...same); rules.push((same.length + 1) + ". Reminder mit gleichem Risiko-Code " + same[0].code + " innert 12 Monaten"); }
    else if (rem.length + 1 >= 3) { level = "Employee Incident"; triggers.push(...rem); rules.push((rem.length + 1) + ". Reminder mit beliebigem Risiko-Code innert 12 Monaten"); }
  }
  if (level === "Employee Incident") {
    const ei = considered.filter(h => h.counts && h.level === "Employee Incident");
    const same = ei.filter(h => codes.includes(h.code));
    if (same.length + 1 >= 2) { level = "HR Referral"; triggers.push(...same); rules.push((same.length + 1) + ". Employee Incident mit gleichem Risiko-Code " + same[0].code + " innert 12 Monaten"); }
    else if (ei.length + 1 >= 3) { level = "HR Referral"; triggers.push(...ei); rules.push((ei.length + 1) + ". Employee Incident mit beliebigem Risiko-Code innert 12 Monaten"); }
  }
  return { from: isoD(from), to: incidentDateStr, considered, level, triggers, rules, applied: level !== baseLevel };
}

function computeLevel({ risk, behavior, code, personId, incidentDate, history, sonder, patternAccepted = true }) {
  if (!risk || !behavior) return null;
  const matrix = MATRIX[behavior][risk];
  const pattern = (Array.isArray(code) ? code.some(Boolean) : code) && personId && incidentDate ? patternCheck(history, personId, code, incidentDate, matrix) : null;
  const sonderHit = (sonder || []).some(s => s.typ === "straftat" || s.typ === "vergeltung");
  const patternLevel = pattern && pattern.applied && patternAccepted ? pattern.level : null;
  const proposed = maxLevel(matrix, patternLevel, sonderHit ? "HR Referral" : null);
  let reason = "Matrix: " + risk + " × " + behavior;
  if (sonderHit && proposed === "HR Referral" && matrix !== "HR Referral") reason = "Sonderregel geht der Matrix vor";
  else if (patternLevel && proposed === patternLevel && patternLevel !== matrix) reason = "Pattern Aggregation hebt an";
  return { matrix, pattern, sonderHit, proposed, reason };
}

// Fristen nach Ist-Prozess (vorläufig)
function deadlines(receivedStr, risk, level, levelSetAt) {
  const r = new Date(receivedStr);
  const out = [
    { key: "erfassen", label: "Erfassung und Analyse", due: addBD(r, 1) },
    { key: "level", label: "Incident Level festlegen", due: addBD(r, 2) }
  ];
  if (risk === "High") out.push({ key: "esk", label: "Eskalation an Leitung Compliance (High)", due: r, sameDay: true });
  if (level === "Reminder") out.push({ key: "rem", label: "Reminder versenden", due: addBD(r, 3) });
  if (level === "Employee Incident") out.push({ key: "ei", label: "Employee Incident abschliessen", due: addDays(r, 30) });
  if (level === "HR Referral") {
    out.push({ key: "hr", label: "Übergabe an HR Disciplinary Team", due: addBD(levelSetAt ? new Date(levelSetAt) : r, 2) });
    out.push({ key: "hrc", label: "HR Referral abschliessen", due: addDays(r, 60) });
  }
  return out;
}

function reminderChecks(text, ctx) {

  if (t === "heute" || t === "gestern") { const d = now(); if (t === "gestern") d.setDate(d.getDate() - 1); return isoD(d) + (withTime ? "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) : ""); }
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{1,2}):(\d{2}))?$/), y, mo, d, h = 0, mi = 0;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; if (m[4]) { h = +m[4]; mi = +m[5]; } }
  else { m = t.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2}|\d{4})(?:,?\s+(\d{1,2})[:.](\d{2}))?$/); if (!m) return null; d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000; if (m[4]) { h = +m[4]; mi = +m[5]; } }
  const dt = new Date(y, mo - 1, d, h, mi);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d || h > 23 || mi > 59) return null;
  return y + "-" + pad(mo) + "-" + pad(d) + (withTime ? "T" + pad(h) + ":" + pad(mi) : "");
}

function judgedState(k) {
  if (!S.f[k]) return "empty";
  if (S.conf[k]) return S.conf[k].status;           // confirmed | changed
  if (S.prop[k] !== undefined && S.prop[k] === S.f[k]) return "proposed";
  if (S.prop[k] !== undefined && S.prop[k] !== S.f[k]) return "deviating";
  return "manual";
}
function confirmJudged(k) {
  const st = judgedState(k);
  if (st === "proposed") { S.conf[k] = { status: "confirmed", by: ASSESSOR, at: now() }; log(ASSESSOR, LABELS[k] + " bestätigt", S.f[k]); }
  else if (st === "deviating") {
    const el = document.getElementById("why-" + k); const reason = el ? el.value.trim() : "";
    if (!reason) { S.error = "Sie weichen beim Feld «" + LABELS[k] + "» vom Vorschlag ab. Bitte kurz begründen."; render(); return; }
    S.conf[k] = { status: "changed", reason, by: ASSESSOR, at: now() }; log(ASSESSOR, LABELS[k] + " geändert", S.prop[k] + " → " + S.f[k] + " · Begründung: " + reason);
  }
  S.error = null; render();
}
function current() {

  const lv = computeLevel({ risk: S.f.risk || null, behavior: S.f.behavior || null, code: [S.f.policy, S.f.policy2], personId: S.f.personId, incidentDate: S.f.vorfall_datum, history: HISTORY, sonder, patternAccepted: !(S.patternDec && S.patternDec.status === "rejected") });
  return { lv, risk: S.f.risk, behavior: S.f.behavior, code: S.f.policy, sonder };
}
function missing() {
  const m = [];
  if (!S.f.personId) m.push("Betroffene Person");
  if (!S.f.meldeweg) m.push("Wie kam die Meldung");
  if (!S.f.vorfall_datum) m.push("Wann wurde der Verstoss begangen");
  if (!S.f.policy) m.push("Verletzte Policy");
  if (!S.f.summary && !S.f.description) m.push("Summary oder Description");
  JUDGED.forEach(k => { const st = judgedState(k); if (st === "empty") { if (!m.includes(LABELS[k])) m.push(LABELS[k]); } else if (st === "proposed" || st === "deviating") m.push(LABELS[k] + " bestätigen"); });
  if (S.f.risk && !S.f.risk_desc.trim()) m.push("Risiko-Beschreibung");
  if (S.f.behavior && !S.f.behavior_desc.trim()) m.push("Verhaltens-Beschreibung");
  S.sonder.forEach(x => { if (x.status === "open") m.push("Sonderregel prüfen"); });
  return m;
}
function baseProposal() {
  const c = current(); if (!c.lv) return null;
  const son = S.sonder.some(x => x.status === "accepted");
  return { matrix: c.lv.matrix, level: maxLevel(c.lv.matrix, son ? "HR Referral" : null), reason: son && c.lv.matrix !== "HR Referral" ? "Sonderregel geht der Matrix vor" : "Matrix: " + c.risk + " × " + c.behavior };
}
function setLevel() {
  const m = missing(); if (m.length) { S.error = "Noch offen: " + m.join(", ") + "."; render(); return; }
  const bp = baseProposal();
  let level = bp.level, override = false, reason = "";
  if (S.ui.override) {
    const ov = $("#ov-level"), ovr = $("#ov-reason");
    if (ov && ov.value && ov.value !== bp.level) { reason = (ovr && ovr.value.trim()) || ""; if (!reason) { S.error = "Eine Übersteuerung braucht eine schriftliche Begründung."; render(); return; } level = ov.value; override = true; }
  }
  S.baseSet = { level, proposed: bp.level, override, reason, at: now() };
  log(ASSESSOR, "Incident Level festgelegt (vor Pattern Aggregation)", level + (override ? " (Vorschlag " + bp.level + ", übersteuert · Begründung: " + reason + ")" : " (" + bp.reason + ")"));
  const pa = patternCheck(HISTORY, S.f.personId, [S.f.policy, S.f.policy2], S.f.vorfall_datum, level);
  S.patternRes = pa; S.patternDec = null; S.error = null; S.ui.override = false;
  const counting = pa.considered.filter(x => x.counts);
  log("System", "Pattern Aggregation gestartet", pa.applied ? pa.rules.join("; ") + " → Höherstufung auf " + pa.level + " vorgeschlagen" : (counting.length ? counting.length + " frühere Fälle im Fenster, keine Höherstufung" : "keine früheren Fälle im Fenster"));
  const name = person(S.f.personId).name;
  S.cchat.push({ id: ++MID, role: "ai", local: true, text: pa.applied
    ? `Level aus der Matrix: **${level}**. Ich habe die Fallhistorie von ${name} geprüft: **${pa.rules.join("; ")}**. Nach der Pattern Aggregation wird der Fall zum **${pa.level}**. Bitte bestätigen Sie die Höherstufung unten in der Fallakte.`
    : `Level aus der Matrix: **${level}**. Ich habe die Fallhistorie von ${name} geprüft: ${counting.length ? counting.length + " frühere Fälle im 12-Monats-Fenster, aber keine Regel der Pattern Aggregation greift" : "keine früheren Fälle im 12-Monats-Fenster"}. Sie können das Incident Level abschliessen.` });
  render();
  setTimeout(() => { const el = document.getElementById("pattern-stage"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
}
function finalizeLevel(decision) {
  const pa = S.patternRes; let level = S.baseSet.level;
  if (decision === "accept") { level = pa.level; S.patternDec = { status: "accepted" }; log(ASSESSOR, "Höherstufung durch Pattern Aggregation bestätigt", S.baseSet.level + " → " + pa.level + " · zugeordnet: " + pa.triggers.map(t => t.ref).join(", ")); }
  if (decision === "reject") {
    const r = (($("#pat-why") || {}).value || "").trim();
    if (!r) { S.error = "Bitte begründen, weshalb die Höherstufung verworfen wird."; render(); return; }
    S.patternDec = { status: "rejected", reason: r }; log(ASSESSOR, "Höherstufung durch Pattern Aggregation verworfen", r);
  }
  S.levelSet = { level, base: S.baseSet.level, override: S.baseSet.override, reason: S.baseSet.reason, at: now() };
  log(ASSESSOR, "Incident Level endgültig festgelegt", level); updQ(level + " · in Bearbeitung");
  S.error = null; S.maxPhase = 3; S.phase = 2;
  S.cchat.push({ id: ++MID, role: "ai", local: true, text: "Ihr Level: **" + level + "**. Unter «Bearbeiten» übergeben Sie den Fall zur Prüfung an " + (level === "HR Referral" ? "das HR Disciplinary Team" : "das Employee Incidents Team (CWB)") + ". " + (level === "HR Referral" ? "Übernimmt HR den Fall, informiert HR die Person." : "Nach der Freigabe entwerfe ich die E-Mail an die Person.") });
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
}
function undoBase() { S.baseSet = null; S.patternRes = null; S.patternDec = null; log(ASSESSOR, "Festlegung aufgehoben", "Fallakte wieder bearbeitbar"); render(); }
function closeNoViolation() {
  const r = $("#nv-reason"); const reason = r ? r.value.trim() : "";

  if (!S.f.personId) { S.error = "Bitte zuerst die betroffene Person bestätigen."; render(); return; }
  const ai = S.breach && S.breach.wert === "nein";
  S.closedNoViolation = { reason, at: now() }; S.levelSet = { level: null, at: now() };
  updQ("No Breach");
  log(ASSESSOR, "Ergebnis festgelegt: No Breach", (ai ? "wie vom Assistenten vorgeschlagen · " : "") + reason);
  S.error = null; S.maxPhase = 3; S.phase = 2;

}

// ---------- Reminder ----------
function remCtx() {

function promptReminder(ctx) {
  const c = ctx.rule;
  return `Du bist der KI-Assistent für Assessors im Employee Incident Management der Musterbank AG (fiktiv). Entwirf die Reminder-E-Mail nach der Vorlage. Der Assessor prüft und gibt frei.

VORLAGE
Guten Tag [Vorname Name]
Am [Datum] wurde festgestellt, dass [kurze, neutrale Beschreibung des Vorfalls]. Damit wurde die Regel «[Name der Regel]» nicht eingehalten.
Die Regel besagt: [kurze Zusammenfassung der Regel]. Sie dient dazu, [Zweck der Regel].
Bitte beachten Sie künftig: [ein bis zwei konkrete Hinweise]. Bei wiederholten Verstössen kann ein künftiger Fall höher eingestuft werden.
[Falls Selbstmeldung: Vielen Dank, dass Sie den Vorfall selbst gemeldet haben.]
Bitte bestätigen Sie den Erhalt dieser Nachricht über den Link unten. Dieser Hinweis wird unter der Referenz [Referenznummer] dokumentiert. Sind Sie mit der Beurteilung nicht einverstanden, wenden Sie sich innert 10 Arbeitstagen an Ihren Line Manager. Bei Fragen steht Ihnen Compliance gerne zur Verfügung.
Freundliche Grüsse
Compliance
[Link: Erhalt bestätigen]

REGELN: sachlich und freundlich; keine Vorwürfe, keine Mutmassungen über Absichten, keine Hinweise auf Sanktionen; zu Wiederholungen nur der allgemeine Satz aus der Vorlage, keine Hinweise auf frühere Fälle und keine Aussage, was beim nächsten Mal konkret passiert; keine Namen weiterer Beteiligter; keine Angaben zur meldenden Person (ausser Dank bei Selbstmeldung); höchstens 170 Wörter; Schweizer Hochdeutsch (ss statt ß).

ANGABEN
Name: ${ctx.personName}
Datum des Vorfalls: ${fmtD(ctx.incidentDate)}
Sachverhalt (intern, nicht wörtlich übernehmen): ${ctx.sachverhalt}
Regel: ${c.name} (${c.weisung} ${c.ziffer}): «${c.zitat}»
Zweck: ${c.zweck}
Hinweis: ${c.hinweis}
Selbstmeldung: ${ctx.selbstmeldung ? "ja" : "nein"}
Referenznummer: ${ctx.ref}

Antworte nur mit JSON: {"betreff":"Erinnerung an die Regel «…» – ${ctx.ref}","text":""} (Text mit Zeilenumbrüchen \\n, ohne Betreffzeile).`;
}
const finalLevel = () => (S.review && (S.review.final || S.review.proposed)) || outcome();
async function draftReminder() {
  const ctx = remCtx(); const isEI = finalLevel() === "Employee Incident";
  const offline = isEI ? fillEI(ctx) : fillReminder(ctx);
  let res = offline;
  if (S.mode === "live" && !isEI) {
    const ctl = new AbortController(); S.busy = { what: "reminder", ctl }; render();
    try { res = await S.ai.json(promptReminder(ctx), { signal: ctl.signal, modelTier: "default", cache: false }); }
    catch (e) { aiFail(e); S.busy = null; if (!(e && e.code === "cancelled")) S.error = errText(e); render(); return; }
    S.busy = null;
  } else { S.busy = { what: "reminder" }; render(); await wait(600); S.busy = null; }
  const text = String(res.text || offline.text);
  S.rem = { type: isEI ? "EI" : "Reminder", betreff: String(res.betreff || offline.betreff), text, orig: text, status: "draft" };
  log("Assistent", (isEI ? "Mitteilung Employee Incident" : "Reminder-E-Mail") + " entworfen", text.trim().split(/\s+/).length + " Wörter");
  S.cchat.push({ id: ++MID, role: "ai", local: true, text: "Der Entwurf der " + (isEI ? "Mitteilung zum Employee Incident" : "Reminder-E-Mail") + " steht links. Prüfen Sie ihn; die automatischen Prüfungen zeigen, ob alle Regeln eingehalten sind." });
  render();
}
function releaseReminder() {
  const ta = $("#rem-text"), tb = $("#rem-subject"); if (ta) S.rem.text = ta.value; if (tb) S.rem.betreff = tb.value;
  const checks = reminderChecks(S.rem.text, remCtx());
  if (checks.some(c => !c.ok) && !S.ui.remForce) { S.ui.remForce = true; S.error = "Nicht alle Prüfungen sind erfüllt. Bitte Text anpassen oder nochmals auf «Versand freigeben» klicken, um bewusst trotzdem freizugeben."; render(); return; }
  S.rem.status = "sent"; S.rem.sentAt = now(); S.ui.remForce = false; S.error = null;
  const nm = S.rem.type === "EI" ? "Mitteilung Employee Incident" : "Reminder-E-Mail";
  log(ASSESSOR, nm + " freigegeben", S.rem.text !== S.rem.orig ? "Entwurf vor der Freigabe angepasst" : "Entwurf unverändert freigegeben");
  log("System", nm + " versandt (simuliert)", "An " + person(S.f.personId).name + ", Kopie " + person(S.f.personId).lm + " · Datum der Information " + fmtD(S.rem.sentAt) + (S.rem.type === "EI" ? " · für das Year-End-Gespräch vorgemerkt" : ""));
  log("System", "Rückmeldung an CWB", "E-Mail versendet, Datum der Information übermittelt · Ticket " + S.handover.ticket);
  setHandedStatus("Abgeschlossen · E-Mail versendet", "done");
  S.cchat.push({ id: ++MID, role: "ai", local: true, text: "Versendet. Ich habe das Datum der Information an die CWB zurückgemeldet; dort überwacht das Employee Incidents Team " + (S.rem.type === "EI" ? "die Stellungnahme und die Year-End-Vormerkung." : "die Erhaltsbestätigung.") });
  S.maxPhase = 3; render();
}

function poWeisungDefault() { const c = cat(S.f.policy); return c ? c.weisung : "W-01"; }

function poQuestion() {

  return c ? "Ist das beschriebene Verhalten ein Verstoss gegen " + c.weisung + " " + c.ziffer.split(";")[0] + " («" + c.name + "»), und wie schwer wiegt es aus Sicht der Weisung?" : "Welche Regel ist hier massgebend, und liegt ein Verstoss vor?";

function zKey(z) { return String(z || "").replace(/^Ziff\.\s*/, "").split(/[\s;]/)[0]; }

  const r = retrieve(q, 6);
  if (!r.length) return `<p class="small muted">Keine passenden Auszüge gefunden. Der Assistent würde sagen, dass die Weisungen das nicht abdecken, und die zuständige Stelle nennen.</p>`;
  return `<p class="small muted">Diese ${r.length} Auszüge gibt der Assistent dem Sprachmodell zu dieser Frage mit, in dieser Reihenfolge. Das Modell antwortet nur auf dieser Grundlage.</p>` + r.map((k, i) => kbCard(k, i + 1)).join("");
}
function setBasis(msg, sel, question) {
  let items = (msg.src || []).map(sourceLookup).filter(Boolean);
  const seen = new Set(); items = items.filter(it => { const k = it.label; if (seen.has(k)) return false; seen.add(k); return true; });
  let fallback = null;
  if (!items.length && question) fallback = retrieve(question, 3);
  S.ui.basis = { mid: msg.id, sel: sel || (items[0] && items[0].label), items, fallback };
}
function basisBox() {
  const b = S.ui.basis;
  if (!b) return `<section class="basis empty"><div class="lab">Passende Weisungsstelle</div><p class="small muted">Stellen Sie links eine Frage. Hier erscheint die Weisungsstelle, auf die sich die Antwort stützt, mit dem Wortlaut der Weisung.</p></section>`;
  const d = b.items.find(x => x.label === b.sel) || b.items[0];
  let body;
  if (d) body = `<div class="kbz"><span class="src">${esc(d.label)}</span><b>${esc(DOCS[d.doc] || d.doc)}</b></div>
      ${d.codes.slice(0, 2).map(c => `<blockquote>«${esc(c.zitat)}»<div class="small muted">Wortlaut ${esc(c.weisung)} ${esc(c.ziffer)} · Risiko-Code ${esc(c.code)}</div></blockquote>`).join("")}
      ${d.cards.slice(0, 1).map(k => `<p class="small"><b>${esc(k.titel)}:</b> ${esc(k.text)}</p>`).join("")}`;
  else body = (b.fallback || []).slice(0, 1).map(k => `<div class="kbz"><span class="src">${esc(k.doc)} ${esc(k.ziff)}</span><b>${esc(k.titel)}</b></div><p class="small">${esc(k.text)}</p>`).join("") || `<p class="small muted">Zu dieser Antwort wurde keine Weisungsstelle zitiert.</p>`;
  const others = b.items.filter(x => x !== d);
  return `<section class="basis"><div class="lab">Passende Weisungsstelle</div>${body}
    ${others.length ? `<div class="qr small"><span class="muted">Ebenfalls zitiert:</span>${others.map(x => `<button class="src" data-act="src" data-mid="${b.mid}" data-v="${esc(x.label)}">${esc(x.label)}</button>`).join("")}</div>` : ""}</section>`;
}
function hl(text, toks) { let h = esc(text); toks.forEach(t => { const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"); h = h.replace(re, "<mark>$1</mark>"); }); return h; }
function kbListHTML() {
  const f = S.ui.kbDoc || "all";
  const raw = (S.ui.kbq || "").trim();
  const toks = raw.split(/\s+/).filter(t => t.length >= 2);
  const nt = toks.map(norm);
  const hit = s => { const n = norm(s); return nt.every(t => n.includes(t)); };
  if (f === "codes") {
    const cs = CATALOG.filter(c => !nt.length || hit(c.code + " " + c.name + " " + c.weisung + " " + c.ziffer + " " + c.zitat));
    return `<p class="small muted">${cs.length} Risiko-Codes</p>` + cs.map(c => `<article class="kbc"><div class="kbz"><span class="src">${c.code}</span><b>${hl(c.name, toks)}</b></div><p class="small muted">${esc(c.weisung)} ${esc(c.ziffer)}</p><p>«${hl(c.zitat, toks)}»</p></article>`).join("");
  }
  const cards = KB.filter(k => !EMP_HIDDEN.includes(k.doc) && (f === "all" || k.doc === f) && (!nt.length || hit(k.doc + " " + k.ziff + " " + k.titel + " " + k.text + " " + DOCS[k.doc])));
  if (!cards.length) return `<p class="small muted">Keine Treffer. Versuchen Sie ein anderes Stichwort oder fragen Sie links den Assistenten.</p>`;
  let out = `<p class="small muted">${nt.length ? cards.length + " Treffer" : cards.length + " Auszüge"}</p>`, cur = "";
  cards.forEach(k => { if (k.doc !== cur) { cur = k.doc; out += `<h3 class="kbdh"><span class="mono">${k.doc}</span> ${esc(DOCS[k.doc])}</h3>`; } out += `<article class="kbc ${S.ui.kbHi === k.id ? "hi" : ""}" id="kb-${k.id}"><div class="kbz"><span class="src">${esc(k.doc)} ${esc(k.ziff)}</span><b>${hl(k.titel, toks)}</b></div><p>${hl(k.text, toks)}</p></article>`; });
  return out;
}
function kbPanel() {
  const f = S.ui.kbDoc || "all";
  const chip = (v, t) => `<button class="fchip ${f === v ? "on" : ""}" data-act="kbDoc" data-v="${v}">${t}</button>`;
  return `<header class="kbp-h"><h2>Weisungen</h2><span class="small muted">W-01 bis W-11 · E-01, E-03, E-04</span></header>
    <div class="kbp-body" id="kb-scroll">
      ${basisBox()}
      <section class="kbsearch"><div class="lab">Weisungen durchsuchen</div>
        <input id="kb-q" type="search" value="${esc(S.ui.kbq || "")}" placeholder="Stichwort, z. B. Geschenk, Phishing, Haltedauer …" autocomplete="off">
        <nav class="fchips" aria-label="Filter">${chip("all", "Alle")}${Object.keys(DOCS).filter(d => !EMP_HIDDEN.includes(d)).map(d => chip(d, d)).join("")}${chip("codes", "Risiko-Codes")}</nav>
        <div id="kb-list" class="kblist">${kbListHTML()}</div></section>
    </div>`;
}
function openSource(src) { const r = sourceLookup(src); if (!r) return; S.ui.drawer = r; render(); }

// ---------- Ereignisse ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "tab") { S.tab = b.dataset.v; S.error = null; S.ui.drawer = null; render(); window.scrollTo({ top: 0 }); return; }
  if (a === "src") { e.preventDefault(); if (S.tab === "chat") { const m = S.chat.find(x => String(x.id) === b.dataset.mid); if (m) { setBasis(m, b.dataset.v); render(); const sc = document.getElementById("kb-scroll"); if (sc) sc.scrollTop = 0; } } else openSource(b.dataset.v); return; }
  if (a === "srcClose") { S.ui.kbSrc = null; render(); return; }
  if (a === "closeDrawer") { S.ui.drawer = null; render(); return; }
  if (a === "kbDoc") { S.ui.kbDoc = b.dataset.v; S.ui.kbHi = null; render(); return; }
  if (a === "kbOpen") { S.ui.drawer = null; S.tab = "chat"; S.ui.kbDoc = b.dataset.v; S.ui.kbHi = b.dataset.id || null; S.ui.kbBrowse = true; render(); setTimeout(() => { const el = document.getElementById("kb-" + b.dataset.id); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 30); return; }
  if (a === "mode") { S.mode = b.dataset.v; S.error = null; render(); return; }
  if (a === "stop") { if (S.busy && S.busy.ctl) S.busy.ctl.abort(); return; }
  if (a === "chatSuggest") { chatSend(b.dataset.v); return; }
  if (a === "repStart") { const i = S.chat.findIndex(m => String(m.id) === b.dataset.id); const q = S.chat.slice(0, i).reverse().find(m => m.role === "user"); S.ui.report = { mid: b.dataset.id, text: q ? q.text : "" }; render(); return; }
  if (a === "repCancel") { S.ui.report = null; render(); return; }
  if (a === "repSend") { const mid = S.ui.report && S.ui.report.mid; const m = S.chat.find(x => String(x.id) === mid); const it = sendReport(); if (m && it) m.reported = it.ref; render(); return; }
  if (a === "openQ") { openQueueItem(b.dataset.id); return; }
  if (a === "qTab") { S.ui.qTab = b.dataset.v; render(); return; }
  if (a === "toQueue") { saveCase(); S.ui.qTab = S.qItem && S.qItem.handed ? (S.qItem.handed.stat === "act" ? "ans" : "sent") : "open"; S.caseOpen = false; S.qItem = null; render(); window.scrollTo({ top: 0 }); return; }
  if (a === "toIncident") { const i = S.chat.findIndex(m => String(m.id) === b.dataset.id); const q = i > 0 ? S.chat[i - 1].text : ""; S.tab = "capture"; newCase(true); render(); if (q) captureSend(q); return; }
  if (a === "cOpt") { captureSend(b.dataset.v); return; }
  if (a === "cExample") { const p = PRESETS.find(x => x.id === b.dataset.id); if (p) captureSend(p.text); return; }
  if (a === "newCase") { newCase(); return; }
  if (a === "pickPerson") { S.f.personId = b.dataset.v; delete S.kiF.personId; log(ASSESSOR, "Person gewählt", b.dataset.v); render(); return; }
  if (a === "confirm") { confirmJudged(b.dataset.k); return; }
  if (a === "undoBase") { undoBase(); return; }
  if (a === "handover") { if (!S.handover) handover(); return; }
  if (a === "finAccept") { finalizeLevel("accept"); return; }
  if (a === "finReject") { finalizeLevel("reject"); return; }
  if (a === "finNone") { finalizeLevel("none"); return; }
  if (a === "patOk") { S.patternDec = { status: "accepted" }; log(ASSESSOR, "Pattern Aggregation bestätigt", current().lv.pattern.rules.join("; ")); render(); return; }
  if (a === "patNo") { const r = ($("#pat-why") || {}).value || ""; if (!r.trim()) { S.error = "Bitte begründen, weshalb die Pattern Aggregation verworfen wird."; render(); return; } S.patternDec = { status: "rejected", reason: r.trim() }; log(ASSESSOR, "Pattern Aggregation verworfen", r.trim()); S.error = null; render(); return; }
  if (a === "sonOk") { const x = S.sonder[+b.dataset.i]; x.status = "accepted"; log(ASSESSOR, "Sonderregel bestätigt", x.typ); render(); return; }
  if (a === "sonNo") { const x = S.sonder[+b.dataset.i]; const r = ($("#son-why-" + b.dataset.i) || {}).value || ""; if (!r.trim()) { S.error = "Bitte begründen, weshalb die Sonderregel verworfen wird."; render(); return; } x.status = "rejected"; x.reason = r.trim(); log(ASSESSOR, "Sonderregel verworfen", x.typ + " · " + x.reason); S.error = null; render(); return; }
  if (a === "goto") { S.phase = +b.dataset.phase; S.error = null; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (a === "overrideToggle") { S.ui.override = !S.ui.override; render(); return; }
  if (a === "setLevel") { setLevel(); return; }
  if (a === "closeNV") { closeNoViolation(); return; }
  if (a === "draftReminder") { draftReminder(); return; }
  if (a === "rev") { reviewRespond(b.dataset.v); return; }
  if (a === "revChange") { S.ui.revChange = !S.ui.revChange; render(); return; }
  if (a === "poStart") { poStart(); return; }
  if (a === "poSend") { poSend(); return; }
  if (a === "poCancel") { S.po = null; render(); return; }
  if (a === "releaseReminder") { releaseReminder(); return; }
});
document.addEventListener("submit", e => { const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault(); const v = f.querySelector("textarea").value; if (f.dataset.form === "chat") chatSend(v); else captureSend(v); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.ui.drawer) { S.ui.drawer = null; render(); return; } if (e.key === "Enter" && !e.shiftKey && (e.target.id === "chat-in" || e.target.id === "c-in")) { e.preventDefault(); e.target.closest("form").requestSubmit(); } });
document.addEventListener("change", e => {
  const t0 = e.target;
  if (t0.id === "po-weisung" && S.po && S.po.status === "draft") { S.po = poDraft(t0.value); render(); return; }
  const t = e.target; if (!t.id || !t.id.startsWith("f-") || locked()) return;
  const k = t.id.slice(2);
  if (k === "selbstmeldung") { S.f.selbstmeldung = t.checked; delete S.kiF.selbstmeldung; return; }
  if (DATEF.includes(k)) {
    S.ui.raw = S.ui.raw || {};
    const v = parseCH(t.value, k === "eingang");
    if (v === null) S.ui.raw[k] = t.value; else { delete S.ui.raw[k]; S.f[k] = v; delete S.kiF[k]; S.patternDec = null; log(ASSESSOR, LABELS[k] + " gesetzt", v ? fmtD(v) : "leer"); }

    if (["risk", "behavior", "policy", "policy2", "personId", "vorfall_datum"].includes(k)) S.patternDec = null;
    if (k === "policy" && S.f.policy2 === S.f.policy) S.f.policy2 = "";
    render();
  } else setTimeout(render, 0);

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "chat-in") S.ui.chatDraft = t.value;
  if (t.id === "kb-q") { S.ui.kbq = t.value; const r = $("#kb-list"); if (r) r.innerHTML = kbListHTML(); return; }
  if (t.id === "c-in") S.ui.cDraft = t.value;
  if (t.id && t.id.startsWith("f-") && !locked() && (t.tagName === "TEXTAREA" || t.type === "text" || t.tagName === "INPUT" && !t.type.startsWith("date") && t.type !== "checkbox")) { const k = t.id.slice(2); if (k in S.f && !DATEF.includes(k)) { S.f[k] = t.value; if (S.kiF[k]) { delete S.kiF[k]; const tag = t.closest(".fld").querySelector(".ki"); if (tag) tag.remove(); } } }
  if (t.id === "po-text" && S.po) S.po.text = t.value;
  if (t.id === "po-subject" && S.po) S.po.betreff = t.value;
  if (t.id === "rem-text" && S.rem) { S.rem.text = t.value; const ul = $("#rem-checks"); if (ul) ul.innerHTML = checksHTML(reminderChecks(S.rem.text, remCtx())); }
});

newCase(true); S.caseOpen = false; seedQueue(); seedAnswers();
render();
initAI();
</script>
