<title>Assessor-Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Arbeitsfläche (Fallakte) links, Fallkontext rechts; oben Stepper durch die vier Phasen */
:root {
  --bg: #fcf9f3; --surface: #ffffff; --surface-2: #fbf9f5; --ink: #1a1f2b; --muted: #646b78; --line: #ece6da; --line-2: #ddd5c6;
  --accent: #2453c7; --accent-ink: #ffffff; --accent-soft: #e8eefc;
  --ai: #2453c7; --ai-soft: #eef3fe; --ai-line: #a3b8ee;
  --ok: #1e7a45; --ok-soft: #e3f4e8; --warn: #c0322b; --warn-soft: #fde8e6;
  --rem: #e3f4e8; --rem-ink: #1e6b3e; --ei: #fdeeec; --ei-ink: #b5392f; --hr: #f8d2cd; --hr-ink: #8f1a12;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-label: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.bar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
#top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 15px var(--f-label); }
.bt { font: 600 15px var(--f-label); letter-spacing: .01em; }
.bs { color: var(--muted); font-size: 12px; }
.top-r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.who { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; font: 500 12.5px var(--f-body); cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
#steps { display: flex; gap: 4px; padding-block: 0 8px; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 6px 12px 6px 6px; border-radius: 999px; color: var(--muted); font: 500 13.5px var(--f-body); cursor: pointer; white-space: nowrap; }
.step .sn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font: 500 12px var(--f-mono); }
.step.active { background: var(--accent-soft); color: var(--ink); }
.step.active .sn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step.done .sn { border-color: var(--ok); color: var(--ok); }
.step:disabled { opacity: .45; cursor: not-allowed; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; padding-block: 20px 48px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
#main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#side { display: flex; flex-direction: column; gap: 12px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); }
@media (max-width: 960px) { #side { position: static; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 1px 2px rgba(60,45,20,.04); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel.slim { padding: 12px 16px; }
.panel.ai-frame { border: 1px dashed var(--ai-line); }
.panel.ausbau { background: var(--surface-2); }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h2 { font: 600 16px var(--f-label); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h3 { font: 600 14px var(--f-label); margin: 0; letter-spacing: .01em; }
p { margin: 0; }
.hint { color: var(--muted); font-size: 12.5px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); }
.lab { display: block; font: 500 11.5px var(--f-label); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.mini { text-transform: none; letter-spacing: 0; color: var(--ai); font-weight: 500; }
input, textarea, select { width: 100%; font: 14px/1.45 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 7px 9px; }
textarea { resize: vertical; }
input[readonly], textarea[readonly] { background: var(--surface-2); }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#report { font-family: var(--f-mono); font-size: 13px; }
.row { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.row .fld { min-width: 200px; }
.grow { flex: 1; }
.btn { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 8px 14px; font: 500 13.5px var(--f-body); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; }
.actions .hint { margin-right: auto; }
.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.preset { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 9px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
.preset.on { border-color: var(--accent); background: var(--accent-soft); }
.pt { font: 500 13.5px var(--f-body); }
.ps { font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 11.5px var(--f-label); letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.sm { font-size: 10.5px; padding: 1px 6px; }
.chip-ai { background: var(--ai-soft); color: var(--ai); border: 1px dashed var(--ai-line); }
.chip-ok { background: var(--ok-soft); color: var(--ok); }
.chip-muted { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.grid2 .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.check { display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.check input { width: auto; }
.cands { display: flex; flex-direction: column; gap: 6px; }
.cand { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--r); padding: 9px 11px; cursor: pointer; }
.cand.on { border-color: var(--accent); background: var(--accent-soft); }
.cand input { width: auto; margin-top: 3px; }
.cn { flex: 1; min-width: 0; }
.why { font-size: 12.5px; }
.conf { font: 500 11px var(--f-label); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.conf-hoch { background: var(--ok-soft); color: var(--ok); }
.conf-niedrig { background: var(--warn-soft); color: var(--warn); }
.more summary { cursor: pointer; color: var(--accent); font-size: 13px; padding-block: 2px; }
.more > *:not(summary) { margin-top: 8px; }
.list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
pre.mail { white-space: pre-wrap; font: 13px/1.5 var(--f-body); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 0; }
.warnline { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; background: var(--warn-soft); border-radius: var(--r); padding: 10px 12px; flex-wrap: wrap; }
.warnline > div { flex: 1; min-width: 220px; }
.alert { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 10px 12px; font-weight: 500; }
.alert.soft { font-weight: 400; }
.busy { display: flex; align-items: center; gap: 12px; background: var(--ai-soft); border: 1px dashed var(--ai-line); border-radius: var(--r); padding: 14px 16px; color: var(--ink); }
.spin { width: 16px; height: 16px; border: 2px solid var(--ai-line); border-top-color: var(--ai); border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.conf-banner { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.conf-banner b { font: 600 13px var(--f-label); text-transform: uppercase; letter-spacing: .05em; }
.conf-banner.conf-niedrig b { color: var(--warn); }
.conf-banner.conf-mittel b { color: var(--ink); }
.conf-banner.conf-hoch b { color: var(--ok); }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dcard.is-open { border: 1px dashed var(--ai-line); background: linear-gradient(var(--ai-soft), var(--ai-soft)) top / 100% 3px no-repeat, var(--surface); }
.dcard.is-done { border-color: var(--line-2); }
.dcard.is-rejected, .dcard.is-invalid { opacity: .7; }
.dcard header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.big { font: 600 20px var(--f-label); letter-spacing: .01em; }
blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--line-2); background: var(--surface-2); font-size: 13.5px; }
.code { font: 500 12px var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 720px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.sub-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.addrule { display: flex; gap: 8px; }
.addrule select { flex: 1; min-width: 0; }
.circ { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.circ li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; padding: 4px 8px; border-radius: 4px; background: var(--surface-2); }
.circ em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.circ .d-mildernd em { color: var(--ok); }
.circ .d-belastend em, .circ .d-schwer-belastend em { color: var(--warn); }
.note { padding-inline: 4px; }
.edit { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); padding: 10px; border-radius: var(--r); }
.lvl { display: inline-block; font: 600 12.5px var(--f-label); letter-spacing: .02em; padding: 3px 10px; border-radius: 4px; white-space: nowrap; }
.lvl.sm { font-size: 11px; padding: 1px 6px; }
.lv-rem { background: var(--rem); color: var(--rem-ink); }
.lv-ei { background: var(--ei); color: var(--ei-ink); }
.lv-hr { background: var(--hr); color: var(--hr-ink); }
.level { border-color: var(--line-2); }
.lvl-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .lvl-grid { grid-template-columns: minmax(0, 1fr); } }
.mx { display: grid; grid-template-columns: minmax(0, 1.25fr) repeat(3, minmax(0, 1fr)); gap: 3px; font-size: 11.5px; }
.mx-c { padding: 7px 5px; border-radius: 4px; text-align: center; opacity: .55; overflow-wrap: anywhere; }
.mx-h, .mx-r { background: transparent; opacity: 1; color: var(--muted); font: 500 11.5px var(--f-label); }
.mx-r { text-align: left; }
.mx-h.hl, .mx-r.hl { color: var(--ink); font-weight: 600; }
.mx-c.sel { opacity: 1; outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 600; }
.lvl-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.result { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r); }
.result > span:first-child { font: 500 11.5px var(--f-label); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.result.final { background: var(--ok-soft); }
.trig { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.trig li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mailhead { display: grid; gap: 2px; font-size: 13px; padding: 8px 12px; background: var(--surface-2); border-radius: var(--r); }
.mailhead span { display: inline-block; width: 52px; color: var(--muted); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.checks li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.checks li > span { font-weight: 600; width: 14px; }
.checks .ok > span { color: var(--ok); }
.checks .bad { color: var(--warn); }
.checks em { font-style: normal; color: var(--muted); font-size: 12px; }
.sentinfo { display: grid; gap: 4px; font-size: 13px; background: var(--ok-soft); padding: 10px 12px; border-radius: var(--r); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stats div { background: var(--surface-2); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; }
.stats b { font: 600 20px var(--f-mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.tablewrap { overflow-x: auto; }
table.log { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
.log th { text-align: left; font: 500 11.5px var(--f-label); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line-2); }
.log td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.log tr.a-ai td:nth-child(2) { color: var(--ai); font-weight: 500; }
.log tr.a-hu td:nth-child(2) { color: var(--accent); font-weight: 500; }
.log tr.a-sys td:nth-child(2) { color: var(--muted); }
.log td:first-child, .log td:nth-child(2) { white-space: nowrap; }
.side-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.side-card h3 { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; margin: 0; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.pname { font: 600 15px var(--f-label); }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.hist li { padding: 7px 9px; border-radius: 4px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.hist li.nc { opacity: .6; }
.dl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.dl li { display: flex; justify-content: space-between; gap: 8px; }
.dl b { font: 500 12.5px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dl li.done { color: var(--muted); text-decoration: line-through; }
.dl li.over b { color: var(--warn); }
.qs { display: flex; flex-direction: column; gap: 10px; }
.q { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.qh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 4px 12px; font: 500 13px var(--f-body); cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 13.5px var(--f-body); padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(40,30,10,.08); }
#app { padding-block: 20px 32px; }
.chat-wrap { max-width: 860px; margin: 0 auto; }
.chatpanel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 70vh; }
.cp-h { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.cp-h h1 { font: 600 19px var(--f-label); margin: 0 0 4px; }
.cp-h p { margin: 0; font-size: 13.5px; }
.msgs { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.chatpanel .msgs { max-height: 62vh; }
.msg { max-width: 88%; display: flex; flex-direction: column; gap: 6px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: 9px 13px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
.msg.ai { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); padding: 10px 13px; border-radius: 14px 14px 14px 4px; }
.msg.ai.err { border-color: var(--warn); }
.who-ai { font: 600 11px var(--f-label); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.msg .body p { margin: 0 0 6px; } .msg .body p:last-child { margin: 0; }
.msg .body ul, .msg .body ol { margin: 4px 0 6px; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.typing { color: var(--muted); font-style: italic; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px; }
.src { font: 500 11.5px var(--f-mono); background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 4px; }
.mwarn { font-size: 12.5px; background: var(--warn-soft); color: var(--warn); padding: 6px 9px; border-radius: 6px; }
.mchg { font-size: 12px; color: var(--ok); }
.qr, .ex { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.welcome p { color: var(--muted); margin: 0 0 8px; }
.sugg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.sug { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font: 14px var(--f-body); color: var(--ink); cursor: pointer; }
.sug:hover { border-color: var(--accent); }
.composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; }
.fine { font-size: 11.5px; color: var(--muted); padding: 0 16px 12px; margin: 0; }
.cap-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .cap-layout { grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; } }
@media (max-width: 700px) { .cap-layout { grid-template-columns: minmax(0, 1fr); } }
.mask { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.asst { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); min-width: 0; }
@media (max-width: 700px) { .asst { position: static; } }
.ap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; height: calc(100vh - 110px); min-height: 460px; }
@media (max-width: 700px) { .ap { height: 560px; } }
.ap-h { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
